name: Build and publish Docker image (PR/sha)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Override Docker image tag (e.g. mytag). Applied as-is.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Normalize image name
        shell: bash
        run: |
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag_override || format('sha-{0}', github.sha) }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_override != '' }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'pull_request' }}

            type=raw,value=${{ format('branch-{0}', github.head_ref || github.ref_name) }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tag_override == '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
