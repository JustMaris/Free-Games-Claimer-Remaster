name: Build and publish Docker image (PR/sha)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Override Docker image tag"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-pr-${{ github.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.name }}
  CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Normalize image name
        shell: bash
        run: |
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.CAN_PUSH == 'true' }}
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME_LC }}:build-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Normalize image name
        shell: bash
        run: |
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest tags
        shell: bash
        env:
          TAG_OVERRIDE: ${{ github.event.inputs.tag_override }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          IMAGE="${REGISTRY}/${OWNER_LC}/${IMAGE_NAME_LC}"
          SOURCES=("${IMAGE}:build-${GITHUB_SHA}-amd64" "${IMAGE}:build-${GITHUB_SHA}-arm64")
          TAGS=("sha-${GITHUB_SHA::7}")

          if [[ -n "$TAG_OVERRIDE" ]]; then
            TAGS+=("$TAG_OVERRIDE")
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SAFE_BRANCH=$(tr '/_' '--' <<< "$HEAD_REF")
            TAGS+=("branch-${SAFE_BRANCH}")
          fi

          ARGS=()
          for tag in "${TAGS[@]}"; do
            ARGS+=(--tag "${IMAGE}:${tag}")
          done
          docker buildx imagetools create "${ARGS[@]}" "${SOURCES[@]}"
